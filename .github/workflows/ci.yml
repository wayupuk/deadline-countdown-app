name: ci
on: [push, pull_request]

env:
  TZ: America/New_York   # reminder tests check daylight-saving behavior
  FLUTTER_VERSION: 3.47.7

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      # tray_manager's native code builds even for tests and needs GTK 3, X11 and Xi headers.
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libx11-dev libxi-dev
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux, artifact: build/linux/x64/release/bundle }
          - { os: windows-latest, target: windows, artifact: build/windows/x64/runner/Release }
          - { os: macos-latest, target: macos, artifact: build/macos/Build/Products/Release }
          - { os: ubuntu-latest, target: apk, artifact: build/app/outputs/flutter-apk/app-release.apk }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libx11-dev libxi-dev libkeybinder-3.0-dev
      - if: matrix.target == 'apk'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build ${{ matrix.target }} --release
      - uses: actions/upload-artifact@v4
        with: { name: 'deadlines-${{ matrix.target }}', path: '${{ matrix.artifact }}' }
