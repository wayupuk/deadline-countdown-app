name: release
# Push a tag like v1.0.0 to build every platform and publish a GitHub Release with the files attached.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: macos }
          - { os: windows-latest, target: windows }
          - { os: ubuntu-latest, target: linux }
          - { os: ubuntu-latest, target: apk }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libx11-dev libxi-dev libkeybinder-3.0-dev
      - if: matrix.target == 'apk'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build ${{ matrix.target }} --release

      - name: Package macOS
        if: matrix.target == 'macos'
        run: ditto -c -k --keepParent "build/macos/Build/Products/Release/Deadline Countdown.app" DeadlineCountdown-macos.zip
      - name: Package Windows
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          Copy-Item -Recurse build/windows/x64/runner/Release DeadlineCountdown
          Compress-Archive -Path DeadlineCountdown -DestinationPath DeadlineCountdown-windows-x64.zip
      - name: Package Linux
        if: matrix.target == 'linux'
        run: |
          mkdir -p DeadlineCountdown
          cp -R build/linux/x64/release/bundle DeadlineCountdown/bundle
          cp linux/packaging/install.sh linux/packaging/deadline-countdown.desktop linux/packaging/deadline-countdown.png DeadlineCountdown/
          tar -czf DeadlineCountdown-linux-x64.tar.gz DeadlineCountdown
      - name: Package Android
        if: matrix.target == 'apk'
        run: cp build/app/outputs/flutter-apk/app-release.apk DeadlineCountdown-android.apk

      - uses: softprops/action-gh-release@v2
        with:
          files: DeadlineCountdown-*
          generate_release_notes: true
